[project]
name = "credere-backend"
version = "0.1.0"
description = "Credere: hệ thống AI đa tác tử điều phối – thực thi cho Trường Đại học Nghệ An (bản thử M-1)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]  # trang demo AI Tuyển sinh (python -m app.web)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
